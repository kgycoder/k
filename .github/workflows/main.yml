name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: "Accept Android SDK licenses"
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4

      - name: "Make gradlew executable"
        run: chmod +x gradlew

      - name: "Restore keystore (optional)"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: "Build debug and release APK"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: "Upload debug APK"
        uses: actions/upload-artifact@v4
        with:
          name: ios-launcher-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: "Upload release APK"
        uses: actions/upload-artifact@v4
        with:
          name: ios-launcher-release
          path: app/build/outputs/apk/release/*.apk

      - name: "Publish GitHub Release on v* tag"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
